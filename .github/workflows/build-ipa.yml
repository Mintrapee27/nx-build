name: Build Game IPA

on:
  workflow_dispatch:
    inputs:
      nsp_url:
        description: 'Link for base game (.nsp, .nsz, .xci, .nup, or .zip/.7z/.rar dump folder)'
        required: true
        type: string
      keys_url:
        description: 'Optional for Switch 2 (.nup/dump) | Required for Switch 1 (.nsp/.xci): Link for prod.keys'
        required: false
        default: ''
        type: string
      extra_urls:
        description: 'Optional: Links for Update / DLC, separated by spaces or commas'
        required: false
        default: ''
        type: string
      program_index:
        description: 'Optional: Program index for Switch 2 Edition (leave "auto" for Switch 2, or "0" for Switch 1)'
        required: false
        default: 'auto'
        type: string
      icon_url:
        description: 'Optional: Direct/Drive/Gofile image URL (.png/.jpg) for custom app icon'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - name: Free up maximum disk space
        run: |
          df -h
          xcrun simctl delete all || true
          sudo rm -rf /Users/runner/Library/Developer/CoreSimulator/* || true
          sudo rm -rf /Users/runner/Library/Caches/* || true
          sudo rm -rf /Users/runner/Library/Developer/Xcode/Archives/* || true
          sudo rm -rf /Users/runner/Library/Developer/Xcode/DerivedData/* || true
          sudo rm -rf /usr/local/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /Users/runner/Library/Android || true
          sudo rm -rf /Applications/Xcode_26*.app || true
          sudo rm -rf /Applications/Xcode_16*.app || true
          brew cleanup --prune=all || true
          df -h

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Xcode Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install Python packages and build tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          python -m pip install lz4 "capstone>=5,<6" fonttools zbic gdown playwright
          python -m playwright install chromium
          brew install xcodegen zstd glslang p7zip unar jq

      - name: Download and extract game files
        env:
          NSP_URL: ${{ inputs.nsp_url }}
          KEYS_URL: ${{ inputs.keys_url }}
          EXTRA_URLS: ${{ inputs.extra_urls }}
          ICON_URL: ${{ inputs.icon_url }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/raw" "$RUNNER_TEMP/game" "$RUNNER_TEMP/keys" "$RUNNER_TEMP/keys_extract" "$RUNNER_TEMP/out" "$RUNNER_TEMP/icon"

          download_file() {
            local url="$1"
            local out="$2"
            if echo "$url" | grep -qiE "gofile\.io/d/"; then
              eval "$(TARGET_GF_URL="$url" python3 - <<'EOF'
          import os, sys, shlex
          from playwright.sync_api import sync_playwright

          target_url = os.environ["TARGET_GF_URL"]
          state = {"direct_url": None, "headers": {}}

          with sync_playwright() as p:
              b = p.chromium.launch(headless=True)
              c = b.new_context()
              page = c.new_page()

              def on_request(req):
                  if "gofile.io/download/" in req.url or ("store" in req.url and "gofile.io" in req.url and "/download/" in req.url):
                      state["direct_url"] = req.url
                      state["headers"] = req.headers

              page.on("request", on_request)
              page.goto(target_url, wait_until="networkidle", timeout=90000)
              page.wait_for_selector('button:has-text("Download"), a:has-text("Download")', timeout=45000)
              page.wait_for_timeout(1500)
              page.locator('button:has-text("Download"), a:has-text("Download")').first.click()
              for _ in range(40):
                  if state["direct_url"]:
                      break
                  page.wait_for_timeout(500)
              cookies = "; ".join([f"{ck['name']}={ck['value']}" for ck in c.cookies()])
              ua = state["headers"].get("user-agent", "Mozilla/5.0")
              ref = state["headers"].get("referer", "https://gofile.io/")
              b.close()
              if not state["direct_url"]:
                  sys.exit(1)
              print(f"GF_URL={shlex.quote(state['direct_url'])}")
              print(f"GF_COOKIE={shlex.quote(cookies)}")
              print(f"GF_UA={shlex.quote(ua)}")
              print(f"GF_REF={shlex.quote(ref)}")
          EOF
          )"
              curl -fL --retry 3 \
                -H "Cookie: $GF_COOKIE" \
                -H "User-Agent: $GF_UA" \
                -H "Referer: $GF_REF" \
                -o "$out" "$GF_URL"
            elif echo "$url" | grep -qiE "drive\.google\.com|docs\.google\.com"; then
              gdown "$url" -O "$out"
            else
              curl -fL --retry 3 -o "$out" "$url"
            fi
          }

          process_file() {
            local src="$1"
            local out_dir="$2"
            local fallback_name="$3"
            local sig6 sig4 xci_magic
            sig6=$(head -c 6 "$src" | xxd -p | tr -d '\n')
            sig4="${sig6:0:8}"

            if [ "$sig6" = "377abcaf271c" ] || [ "$sig4" = "504b0304" ] || [ "$sig4" = "504b0506" ] || [ "$sig4" = "504b0708" ]; then
              7z x "$src" -o"$out_dir" -y
              rm -f "$src"
            elif [ "$sig6" = "526172211a07" ]; then
              unar -f -o "$out_dir" "$src"
              rm -f "$src"
            else
              xci_magic=$(dd if="$src" bs=1 skip=256 count=4 2>/dev/null || true)
              if [ "$sig4" = "4e555030" ] || [ "$sig4" = "4e555000" ] || [ "${sig6:0:6}" = "4e5550" ]; then
                mv "$src" "$out_dir/${fallback_name}.nup"
              elif head -c 65536 "$src" | grep -qa "\.ncz"; then
                if [ "$xci_magic" = "HEAD" ]; then
                  mv "$src" "$out_dir/${fallback_name}.xcz"
                else
                  mv "$src" "$out_dir/${fallback_name}.nsz"
                fi
              elif [ "$xci_magic" = "HEAD" ]; then
                mv "$src" "$out_dir/${fallback_name}.xci"
              else
                mv "$src" "$out_dir/${fallback_name}.nsp"
              fi
            fi
          }

          if [ -n "$KEYS_URL" ]; then
            download_file "$KEYS_URL" "$RUNNER_TEMP/raw/keys_in"
            process_file "$RUNNER_TEMP/raw/keys_in" "$RUNNER_TEMP/keys_extract" "keys"
            FOUND_KEYS=$(find "$RUNNER_TEMP/keys_extract" -type f -iname "*prod*.keys" | head -n 1)
            [ -z "$FOUND_KEYS" ] && FOUND_KEYS=$(find "$RUNNER_TEMP/keys_extract" -type f -iname "*.keys" | head -n 1)
            [ -z "$FOUND_KEYS" ] && FOUND_KEYS=$(find "$RUNNER_TEMP/keys_extract" -type f | head -n 1)
            if [ -n "$FOUND_KEYS" ]; then
              cp "$FOUND_KEYS" "$RUNNER_TEMP/keys/prod.keys"
              mkdir -p "$HOME/.switch"
              cp "$RUNNER_TEMP/keys/prod.keys" "$HOME/.switch/prod.keys"
            fi
            FOUND_TITLE_KEYS=$(find "$RUNNER_TEMP/keys_extract" -type f -iname "*title*.keys" | head -n 1)
            [ -n "$FOUND_TITLE_KEYS" ] && cp "$FOUND_TITLE_KEYS" "$HOME/.switch/title.keys"
          fi

          if [ -n "$ICON_URL" ]; then
            download_file "$ICON_URL" "$RUNNER_TEMP/icon/custom_icon"
          fi

          download_file "$NSP_URL" "$RUNNER_TEMP/raw/base_in"
          process_file "$RUNNER_TEMP/raw/base_in" "$RUNNER_TEMP/game" "base"

          i=1
          for url in $(echo "$EXTRA_URLS" | tr ',' ' '); do
            [ -z "$url" ] && continue
            download_file "$url" "$RUNNER_TEMP/raw/extra_${i}_in"
            process_file "$RUNNER_TEMP/raw/extra_${i}_in" "$RUNNER_TEMP/game" "extra_${i}"
            i=$((i + 1))
          done

          find "$RUNNER_TEMP/game" -mindepth 2 -type f \( -iname "*.nsp" -o -iname "*.xci" -o -iname "*.nsz" -o -iname "*.xcz" -o -iname "*.nup" \) -exec mv -n {} "$RUNNER_TEMP/game/" \;

          if find "$RUNNER_TEMP/game" -maxdepth 1 -type f \( -iname "*.nsz" -o -iname "*.xcz" \) | grep -q .; then
            echo "Detected .nsz/.xcz file(s), decompressing..."
            python3 -m venv "$RUNNER_TEMP/nsz_venv"
            "$RUNNER_TEMP/nsz_venv/bin/pip" install --quiet nsz
            find "$RUNNER_TEMP/game" -maxdepth 1 -type f \( -iname "*.nsz" -o -iname "*.xcz" \) | while read -r comp_file; do
              "$RUNNER_TEMP/nsz_venv/bin/nsz" -D "$comp_file" -o "$RUNNER_TEMP/game"
              rm -f "$comp_file"
            done
          fi

          ls -lh "$RUNNER_TEMP/game"
          df -h

      - name: Build IPA from NSP / NUP / Dump Folder
        env:
          PROGRAM_INDEX: ${{ inputs.program_index }}
        run: |
          set -e
          TOTAL_BYTES=$(find "$RUNNER_TEMP/game" -type f -exec stat -f%z {} + | awk '{s+=$1} END {print s+0}')
          LIMIT_BYTES=$((4 * 1024 * 1024 * 1024))

          if [ "$TOTAL_BYTES" -gt "$LIMIT_BYTES" ]; then
            echo "ขนาดไฟล์เกมเกิน 4GB ($TOTAL_BYTES bytes) -> ใช้โหมดแยก RomFS.img อัตโนมัติ"
            ROMFS_MODE="separate"
            KEEP_FLAG="--keep-extracted"
          else
            echo "ขนาดไฟล์เกมไม่เกิน 4GB ($TOTAL_BYTES bytes) -> รวมใน IPA ไฟล์เดียว (bundle)"
            ROMFS_MODE="bundle"
            KEEP_FLAG="--no-keep-extracted"
          fi

          TARGET_INPUT="$RUNNER_TEMP/game"
          NUP_FILE=$(find "$RUNNER_TEMP/game" -maxdepth 1 -type f -iname "*.nup" | head -n 1)
          DUMP_EXEFS=$(find "$RUNNER_TEMP/game" -type d -iname "exefs" | head -n 1)

          if [ -n "$NUP_FILE" ]; then
            echo "Detected Switch 2 NUP container: $NUP_FILE"
            TARGET_INPUT="$NUP_FILE"
          elif [ -n "$DUMP_EXEFS" ]; then
            PARENT_DIR=$(dirname "$DUMP_EXEFS")
            if [ "$(basename "$PARENT_DIR" | tr '[:upper:]' '[:lower:]')" = "base" ]; then
              TARGET_INPUT=$(dirname "$PARENT_DIR")
            else
              TARGET_INPUT="$PARENT_DIR"
            fi
            echo "Detected extracted dump folder: $TARGET_INPUT"
          fi

          EXTRA_ARGS=()
          if [ -f "$RUNNER_TEMP/keys/prod.keys" ]; then
            EXTRA_ARGS+=(-k "$RUNNER_TEMP/keys/prod.keys")
          fi
          if [ -f "$RUNNER_TEMP/icon/custom_icon" ]; then
            EXTRA_ARGS+=(--icon "$RUNNER_TEMP/icon/custom_icon")
          fi
          if [ -n "$PROGRAM_INDEX" ] && [ "$PROGRAM_INDEX" != "auto" ]; then
            EXTRA_ARGS+=(--program "$PROGRAM_INDEX")
          fi

          python3 -c '
          import sys, shutil, runpy, os, fcntl, struct, pathlib, re, builtins, subprocess, glob, json
          from collections import namedtuple, Counter

          Usage = namedtuple("usage", "total used free")
          shutil.disk_usage = lambda path: Usage(200 * 1024**3, 10 * 1024**3, 190 * 1024**3)

          sys.path.insert(0, "dm/tools")
          import romfs_image

          offset_counts = Counter()
          def extract_ints(obj, out, depth=0):
              if depth > 3:
                  return
              if isinstance(obj, int) and not isinstance(obj, bool):
                  if obj >= 4096:
                      out.append(obj)
              elif isinstance(obj, (tuple, list)):
                  for x in obj:
                      extract_ints(x, out, depth + 1)
              elif isinstance(obj, dict):
                  for x in obj.values():
                      extract_ints(x, out, depth + 1)
              elif hasattr(obj, "__dict__"):
                  for x in obj.__dict__.values():
                      extract_ints(x, out, depth + 1)
              elif hasattr(obj, "__slots__"):
                  for s in obj.__slots__:
                      if hasattr(obj, s):
                          extract_ints(getattr(obj, s), out, depth + 1)

          orig_write = romfs_image.write
          def hooked_write(ents, dst, copy):
              offset_counts.clear()
              for e in ents:
                  nums = []
                  extract_ints(e[1], nums)
                  for v in set(nums):
                      offset_counts[v] += 1
              print(f"[PUNCH-INIT] Indexed {len(offset_counts)} offsets from {len(ents)} entries (skipping deduplicated blobs)")
              return orig_write(ents, dst, copy)
          romfs_image.write = hooked_write

          nup_path = sys.argv[1]
          rw_fd = os.open(nup_path, os.O_RDWR) if os.path.isfile(nup_path) else None

          intervals = []
          bytes_since_flush = 0
          total_reclaimed = 0
          F_PUNCHHOLE = 99
          ALIGN = 16384

          def flush_holes():
              global intervals, bytes_since_flush, total_reclaimed
              if not rw_fd or not intervals:
                  return
              intervals.sort()
              merged = []
              for s, e in intervals:
                  if merged and s <= merged[-1][1]:
                      merged[-1] = (merged[-1][0], max(merged[-1][1], e))
                  else:
                      merged.append((s, e))
              kept = []
              for s, e in merged:
                  a_s = (s + ALIGN - 1) & ~(ALIGN - 1)
                  a_e = e & ~(ALIGN - 1)
                  if a_e > a_s:
                      try:
                          fcntl.fcntl(rw_fd, F_PUNCHHOLE, struct.pack("IIqq", 0, 0, a_s, a_e - a_s))
                          total_reclaimed += (a_e - a_s)
                      except Exception as ex:
                          print(f"[PUNCH-WARN] {ex}")
                      if a_s > s:
                          kept.append((s, a_s))
                      if e > a_e:
                          kept.append((a_e, e))
                  else:
                      kept.append((s, e))
              intervals = kept
              bytes_since_flush = 0
              if total_reclaimed > 0 and total_reclaimed % (2 * 1024**3) < 128 * 1024**2:
                  print(f"[PUNCH-OK] Reclaimed {total_reclaimed / (1024**3):.2f} GB from base.nup")

          def punch_nup(eoff, a, b):
              global bytes_since_flush
              if offset_counts.get(eoff, 0) != 1:
                  return
              intervals.append((a, b))
              bytes_since_flush += (b - a)
              if bytes_since_flush >= 128 * 1024 * 1024:
                  flush_holes()

          builtins._punch_nup = punch_nup

          # Hook before [5/7] iOS shaders: delete base.nup + upload & truncate RomFS.img to free 25+ GB
          cleaned_for_shaders = False
          orig_popen = subprocess.Popen
          work_dir = sys.argv[sys.argv.index("--work-dir") + 1]
          out_dir = os.path.dirname(sys.argv[sys.argv.index("-o") + 1])

          class HookedPopen(orig_popen):
              def __init__(self, args, *pargs, **kwargs):
                  global cleaned_for_shaders, rw_fd
                  cmd_str = " ".join(str(x) for x in args) if isinstance(args, (list, tuple)) else str(args)
                  if not cleaned_for_shaders and "own_compilers.py" in cmd_str:
                      cleaned_for_shaders = True
                      print("[PRE-SHADER] Freeing disk space before compiling 42k+ iOS shaders...")
                      if rw_fd is not None:
                          try:
                              os.close(rw_fd)
                          except Exception:
                              pass
                          rw_fd = None
                      if os.path.isfile(nup_path):
                          try:
                              os.remove(nup_path)
                              print(f"[PRE-SHADER] Deleted {nup_path}")
                          except Exception as ex:
                              print(f"[PRE-SHADER-WARN] Failed to delete nup: {ex}")
                      romfs_files = glob.glob(os.path.join(work_dir, "extract", "*", "RomFS.img"))
                      for rf in romfs_files:
                          if os.path.getsize(rf) > 0:
                              print(f"[PRE-SHADER] Uploading {rf} ({os.path.getsize(rf)/(1024**3):.2f} GB) to Gofile...")
                              try:
                                  p = orig_popen(["curl", "-fS", "--retry", "3", "-F", f"file=@{rf}", "https://upload.gofile.io/uploadfile"], stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
                                  out, err = p.communicate()
                                  print(out)
                                  link = json.loads(out).get("data", {}).get("downloadPage", "")
                                  if link:
                                      pathlib.Path(os.path.join(out_dir, "romfs_link.txt")).write_text(link + "\n")
                                      print("==========================================")
                                      print(f"ROMFS DOWNLOAD LINK: {link}")
                                      print("==========================================")
                                      os.truncate(rf, 0)
                                      print(f"[PRE-SHADER] Truncated {rf} to 0 bytes to free 22+ GB for shader cache!")
                                  else:
                                      print(f"[PRE-SHADER-WARN] No Gofile link returned: {err}")
                              except Exception as ex:
                                  print(f"[PRE-SHADER-WARN] Upload failed: {ex}")
                      orig_popen(["df", "-h"]).wait()
                  super().__init__(args, *pargs, **kwargs)

          subprocess.Popen = HookedPopen

          pack_nup_path = pathlib.Path("scripts/pack_nup.py")
          if pack_nup_path.exists():
              code = pack_nup_path.read_text()
              def repl(m):
                  ind = m.group(1)
                  return (
                      f"{ind}for p in range(eoff, eoff + esz, 8 << 20):\n"
                      f"{ind}    end_p = min(p + (8 << 20), eoff + esz)\n"
                      f"{ind}    put(view[p:end_p])\n"
                      f"{ind}    _punch_nup(eoff, p, end_p)"
                  )
              new_code, count = re.subn(
                  r"^([ \t]*)for p in range\(eoff, eoff \+ esz, 8 << 20\): put\(view\[p:min\(p \+ \(8 << 20\), eoff \+ esz\)\]\)",
                  repl,
                  code,
                  flags=re.MULTILINE
              )
              if count:
                  pack_nup_path.write_text(new_code)
                  print(f"[PATCH] Enabled dedup-safe F_PUNCHHOLE (99) in pack_nup.py ({count} place)")

          sys.argv[0] = "scripts/build_ipa_from_nsp.py"
          runpy.run_path("scripts/build_ipa_from_nsp.py", run_name="__main__")
          ' "$TARGET_INPUT" \
            "${EXTRA_ARGS[@]}" \
            -o "$RUNNER_TEMP/out/game.ipa" \
            --work-dir "$RUNNER_TEMP/work" \
            --romfs "$ROMFS_MODE" \
            $KEEP_FLAG \
            --progress lines

          rm -rf "$RUNNER_TEMP/game"/* "$RUNNER_TEMP/raw"/*
          df -h

      - name: Upload RomFS.img to Gofile (if separate)
        run: |
          if [ -f "$RUNNER_TEMP/out/romfs_link.txt" ]; then
            echo "=========================================="
            echo "ROMFS DOWNLOAD LINK: $(cat "$RUNNER_TEMP/out/romfs_link.txt")"
            echo "=========================================="
          else
            ROMFS_IMG=$(find "$RUNNER_TEMP/work/extract" -type f -name "RomFS.img" | head -n 1)
            if [ -n "$ROMFS_IMG" ] && [ -s "$ROMFS_IMG" ]; then
              echo "Uploading RomFS.img ($(ls -lh "$ROMFS_IMG" | awk '{print $5}')) to Gofile..."
              RESP=$(curl -fS --retry 3 -F "file=@$ROMFS_IMG" https://upload.gofile.io/uploadfile)
              echo "$RESP"
              LINK=$(echo "$RESP" | jq -r '.data.downloadPage // empty')
              echo "$LINK" > "$RUNNER_TEMP/out/romfs_link.txt"
              echo "=========================================="
              echo "ROMFS DOWNLOAD LINK: $LINK"
              echo "=========================================="
            else
              echo "No separate RomFS.img found (bundled inside IPA)."
            fi
          fi

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: game-ipa
          path: |
            ${{ runner.temp }}/out/*.ipa
            ${{ runner.temp }}/out/romfs_link.txt
          retention-days: 7
