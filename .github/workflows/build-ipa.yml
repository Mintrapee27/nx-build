name: Build Game IPA

on:
  workflow_dispatch:
    inputs:
      nsp_url:
        description: 'Link for base game (.nsp, .nsz, .xci, .nup, or .zip/.7z/.rar dump folder)'
        required: true
        type: string
      keys_url:
        description: 'Optional for Switch 2 (.nup/dump) | Required for Switch 1 (.nsp/.xci): Link for prod.keys'
        required: false
        default: ''
        type: string
      extra_urls:
        description: 'Optional: Links for Update / DLC, separated by spaces or commas'
        required: false
        default: ''
        type: string
      program_index:
        description: 'Optional: Program index for Switch 2 Edition (leave "auto" for Switch 2, or "0" for Switch 1)'
        required: false
        default: 'auto'
        type: string
      icon_url:
        description: 'Optional: Direct/Drive/Gofile image URL (.png/.jpg) for custom app icon'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Free up disk space
        run: |
          df -h
          xcrun simctl delete all || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true
          sudo rm -rf /Users/runner/Library/Developer/CoreSimulator/* || true
          sudo rm -rf /Users/runner/Library/Caches/* || true
          sudo rm -rf /Users/runner/Library/Developer/Xcode/Archives/* || true
          sudo rm -rf /usr/local/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          brew cleanup --prune=all || true
          df -h

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Xcode Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install Python packages and build tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          python -m pip install lz4 "capstone>=5,<6" fonttools zbic gdown playwright
          python -m playwright install chromium
          brew install xcodegen zstd glslang p7zip unar

      - name: Download and extract game files
        env:
          NSP_URL: ${{ inputs.nsp_url }}
          KEYS_URL: ${{ inputs.keys_url }}
          EXTRA_URLS: ${{ inputs.extra_urls }}
          ICON_URL: ${{ inputs.icon_url }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/raw" "$RUNNER_TEMP/game" "$RUNNER_TEMP/keys" "$RUNNER_TEMP/keys_extract" "$RUNNER_TEMP/out" "$RUNNER_TEMP/icon"

          download_file() {
            local url="$1"
            local out="$2"
            if echo "$url" | grep -qiE "gofile\.io/d/"; then
              eval "$(python3 -c '
          import sys, shlex
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              b = p.chromium.launch(headless=True)
              c = b.new_context()
              page = c.new_page()
              direct_url = None
              req_headers = {}

              def on_request(req):
                  nonlocal direct_url, req_headers
                  if "gofile.io/download/" in req.url or ("store" in req.url and "gofile.io" in req.url and "/download/" in req.url):
                      direct_url = req.url
                      req_headers = req.headers

              page.on("request", on_request)
              page.goto(sys.argv[1], wait_until="networkidle", timeout=90000)
              page.wait_for_selector("button:has-text(\"Download\"), a:has-text(\"Download\")", timeout=45000)
              page.wait_for_timeout(1500)
              page.locator("button:has-text(\"Download\"), a:has-text(\"Download\")").first.click()
              for _ in range(40):
                  if direct_url:
                      break
                  page.wait_for_timeout(500)
              cookies = "; ".join([f"{ck[\"name\"]}={ck[\"value\"]}" for ck in c.cookies()])
              ua = req_headers.get("user-agent", "Mozilla/5.0")
              ref = req_headers.get("referer", "https://gofile.io/")
              b.close()
              if not direct_url:
                  sys.exit(1)
              print(f"GF_URL={shlex.quote(direct_url)}")
              print(f"GF_COOKIE={shlex.quote(cookies)}")
              print(f"GF_UA={shlex.quote(ua)}")
              print(f"GF_REF={shlex.quote(ref)}")
          ' "$url")"
              curl -fL --retry 3 \
                -H "Cookie: $GF_COOKIE" \
                -H "User-Agent: $GF_UA" \
                -H "Referer: $GF_REF" \
                -o "$out" "$GF_URL"
            elif echo "$url" | grep -qiE "drive\.google\.com|docs\.google\.com"; then
              gdown "$url" -O "$out"
            else
              curl -fL --retry 3 -o "$out" "$url"
            fi
          }

          process_file() {
            local src="$1"
            local out_dir="$2"
            local fallback_name="$3"
            local sig6 sig4 xci_magic
            sig6=$(head -c 6 "$src" | xxd -p | tr -d '\n')
            sig4="${sig6:0:8}"

            if [ "$sig6" = "377abcaf271c" ] || [ "$sig4" = "504b0304" ] || [ "$sig4" = "504b0506" ] || [ "$sig4" = "504b0708" ]; then
              7z x "$src" -o"$out_dir" -y
              rm -f "$src"
            elif [ "$sig6" = "526172211a07" ]; then
              unar -f -o "$out_dir" "$src"
              rm -f "$src"
            else
              xci_magic=$(dd if="$src" bs=1 skip=256 count=4 2>/dev/null || true)
              if [ "$sig4" = "4e555030" ] || [ "$sig4" = "4e555000" ] || [ "${sig6:0:6}" = "4e5550" ]; then
                mv "$src" "$out_dir/${fallback_name}.nup"
              elif head -c 65536 "$src" | grep -qa "\.ncz"; then
                if [ "$xci_magic" = "HEAD" ]; then
                  mv "$src" "$out_dir/${fallback_name}.xcz"
                else
                  mv "$src" "$out_dir/${fallback_name}.nsz"
                fi
              elif [ "$xci_magic" = "HEAD" ]; then
                mv "$src" "$out_dir/${fallback_name}.xci"
              else
                mv "$src" "$out_dir/${fallback_name}.nsp"
              fi
            fi
          }

          if [ -n "$KEYS_URL" ]; then
            download_file "$KEYS_URL" "$RUNNER_TEMP/raw/keys_in"
            process_file "$RUNNER_TEMP/raw/keys_in" "$RUNNER_TEMP/keys_extract" "keys"
            FOUND_KEYS=$(find "$RUNNER_TEMP/keys_extract" -type f -iname "*prod*.keys" | head -n 1)
            [ -z "$FOUND_KEYS" ] && FOUND_KEYS=$(find "$RUNNER_TEMP/keys_extract" -type f -iname "*.keys" | head -n 1)
            [ -z "$FOUND_KEYS" ] && FOUND_KEYS=$(find "$RUNNER_TEMP/keys_extract" -type f | head -n 1)
            if [ -n "$FOUND_KEYS" ]; then
              cp "$FOUND_KEYS" "$RUNNER_TEMP/keys/prod.keys"
              mkdir -p "$HOME/.switch"
              cp "$RUNNER_TEMP/keys/prod.keys" "$HOME/.switch/prod.keys"
            fi
            FOUND_TITLE_KEYS=$(find "$RUNNER_TEMP/keys_extract" -type f -iname "*title*.keys" | head -n 1)
            [ -n "$FOUND_TITLE_KEYS" ] && cp "$FOUND_TITLE_KEYS" "$HOME/.switch/title.keys"
          fi

          if [ -n "$ICON_URL" ]; then
            download_file "$ICON_URL" "$RUNNER_TEMP/icon/custom_icon"
          fi

          download_file "$NSP_URL" "$RUNNER_TEMP/raw/base_in"
          process_file "$RUNNER_TEMP/raw/base_in" "$RUNNER_TEMP/game" "base"

          i=1
          for url in $(echo "$EXTRA_URLS" | tr ',' ' '); do
            [ -z "$url" ] && continue
            download_file "$url" "$RUNNER_TEMP/raw/extra_${i}_in"
            process_file "$RUNNER_TEMP/raw/extra_${i}_in" "$RUNNER_TEMP/game" "extra_${i}"
            i=$((i + 1))
          done

          find "$RUNNER_TEMP/game" -mindepth 2 -type f \( -iname "*.nsp" -o -iname "*.xci" -o -iname "*.nsz" -o -iname "*.xcz" -o -iname "*.nup" \) -exec mv -n {} "$RUNNER_TEMP/game/" \;

          if find "$RUNNER_TEMP/game" -maxdepth 1 -type f \( -iname "*.nsz" -o -iname "*.xcz" \) | grep -q .; then
            echo "Detected .nsz/.xcz file(s), decompressing..."
            python3 -m venv "$RUNNER_TEMP/nsz_venv"
            "$RUNNER_TEMP/nsz_venv/bin/pip" install --quiet nsz
            find "$RUNNER_TEMP/game" -maxdepth 1 -type f \( -iname "*.nsz" -o -iname "*.xcz" \) | while read -r comp_file; do
              "$RUNNER_TEMP/nsz_venv/bin/nsz" -D "$comp_file" -o "$RUNNER_TEMP/game"
              rm -f "$comp_file"
            done
          fi

          ls -lh "$RUNNER_TEMP/game"
          df -h

      - name: Build IPA from NSP / NUP / Dump Folder
        env:
          PROGRAM_INDEX: ${{ inputs.program_index }}
        run: |
          set -e
          TOTAL_BYTES=$(find "$RUNNER_TEMP/game" -type f -exec stat -f%z {} + | awk '{s+=$1} END {print s+0}')
          LIMIT_BYTES=$((4 * 1024 * 1024 * 1024))

          if [ "$TOTAL_BYTES" -gt "$LIMIT_BYTES" ]; then
            echo "ขนาดไฟล์เกมเกิน 4GB ($TOTAL_BYTES bytes) -> ใช้โหมดแยก RomFS.img อัตโนมัติ"
            ROMFS_MODE="separate"
            KEEP_FLAG="--keep-extracted"
          else
            echo "ขนาดไฟล์เกมไม่เกิน 4GB ($TOTAL_BYTES bytes) -> รวมใน IPA ไฟล์เดียว (bundle)"
            ROMFS_MODE="bundle"
            KEEP_FLAG="--no-keep-extracted"
          fi

          TARGET_INPUT="$RUNNER_TEMP/game"
          NUP_FILE=$(find "$RUNNER_TEMP/game" -maxdepth 1 -type f -iname "*.nup" | head -n 1)
          DUMP_EXEFS=$(find "$RUNNER_TEMP/game" -type d -iname "exefs" | head -n 1)

          if [ -n "$NUP_FILE" ]; then
            echo "Detected Switch 2 NUP container: $NUP_FILE"
            TARGET_INPUT="$NUP_FILE"
          elif [ -n "$DUMP_EXEFS" ]; then
            PARENT_DIR=$(dirname "$DUMP_EXEFS")
            if [ "$(basename "$PARENT_DIR" | tr '[:upper:]' '[:lower:]')" = "base" ]; then
              TARGET_INPUT=$(dirname "$PARENT_DIR")
            else
              TARGET_INPUT="$PARENT_DIR"
            fi
            echo "Detected extracted dump folder: $TARGET_INPUT"
          fi

          EXTRA_ARGS=()
          if [ -f "$RUNNER_TEMP/keys/prod.keys" ]; then
            EXTRA_ARGS+=(-k "$RUNNER_TEMP/keys/prod.keys")
          fi
          if [ -f "$RUNNER_TEMP/icon/custom_icon" ]; then
            EXTRA_ARGS+=(--icon "$RUNNER_TEMP/icon/custom_icon")
          fi
          if [ -n "$PROGRAM_INDEX" ] && [ "$PROGRAM_INDEX" != "auto" ]; then
            EXTRA_ARGS+=(--program "$PROGRAM_INDEX")
          fi

          python3 scripts/build_ipa_from_nsp.py "$TARGET_INPUT" \
            "${EXTRA_ARGS[@]}" \
            -o "$RUNNER_TEMP/out/game.ipa" \
            --work-dir "$RUNNER_TEMP/work" \
            --romfs "$ROMFS_MODE" \
            $KEEP_FLAG \
            --progress lines

          rm -rf "$RUNNER_TEMP/game"/*
          df -h

      - name: Upload IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: game-ipa
          path: |
            ${{ runner.temp }}/out/*.ipa
            ${{ runner.temp }}/work/extract/*/RomFS.img
          retention-days: 7
