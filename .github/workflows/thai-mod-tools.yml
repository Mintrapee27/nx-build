name: Thai Mod Tools (Export, Auto-Translate & Build RomFS)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Select mode: export (fast 2m font test), translate_all, or build'
        required: true
        default: 'export'
        type: choice
        options:
          - export
          - translate_all
          - build
      romfs_url:
        description: 'Gofile or Google Drive link for original RomFS.img (6.0GB)'
        required: true
        type: string
      mod_zip_url:
        description: 'Optional: Gofile/Drive link to custom translated zip'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools & Python libraries
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full unar curl fonts-noto-core
          python -m pip install gdown playwright fonttools deep-translator
          playwright install chromium

      - name: Run Thai Mod Pipeline
        env:
          MODE: ${{ inputs.mode }}
          ROMFS_URL: ${{ inputs.romfs_url }}
          MOD_ZIP_URL: ${{ inputs.mod_zip_url }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/raw" "$RUNNER_TEMP/out" "$RUNNER_TEMP/mod_in" "$RUNNER_TEMP/romfs_tree"
          python3 -u -c '
          import os, sys, json, re, time, struct, subprocess
          from concurrent.futures import ThreadPoolExecutor
          from fontTools.ttLib import TTFont
          from fontTools.merge import Merger

          sys.path.insert(0, os.path.abspath("dm/tools"))
          import romfs

          temp_dir = os.environ["RUNNER_TEMP"]
          mode = os.environ["MODE"]
          romfs_url = os.environ["ROMFS_URL"]
          mod_zip_url = os.environ.get("MOD_ZIP_URL", "").strip()

          def download_file(url, out_path):
              if "gofile.io/d/" in url.lower():
                  from playwright.sync_api import sync_playwright
                  with sync_playwright() as p:
                      browser = p.chromium.launch(headless=True)
                      context = browser.new_context(accept_downloads=True)
                      page = context.new_page()
                      page.goto(url, wait_until="networkidle", timeout=90000)
                      page.wait_for_selector("button:has-text(\"Download\"), a:has-text(\"Download\")", timeout=45000)
                      time.sleep(2)
                      with page.expect_download(timeout=0) as dl_info:
                          page.locator("button:has-text(\"Download\"), a:has-text(\"Download\")").first.click()
                      dl = dl_info.value
                      print(f"Downloading {dl.suggested_filename}...", flush=True)
                      dl.save_as(out_path)
                      browser.close()
              elif "drive.google.com" in url.lower() or "docs.google.com" in url.lower():
                  subprocess.run(["gdown", url, "-O", out_path], check=True)
              else:
                  subprocess.run(["curl", "-fL", "--retry", "3", "-o", out_path, url], check=True)

          raw_romfs = os.path.join(temp_dir, "raw", "RomFS.img")
          download_file(romfs_url, raw_romfs)
          print("Download finished. Starting processing...", flush=True)

