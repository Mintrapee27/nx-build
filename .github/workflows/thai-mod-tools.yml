name: Thai Mod Tools (Export, Auto-Translate & Build RomFS)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Select mode: export (fast 2m font test), translate_all, or build'
        required: true
        default: 'export'
        type: choice
        options:
          - export
          - translate_all
          - build
      romfs_url:
        description: 'Gofile or Google Drive link for original RomFS.img (6.0GB)'
        required: true
        type: string
      mod_zip_url:
        description: 'Optional: Gofile/Drive link to custom translated zip'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools & Python libraries
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full unar curl fonts-noto-core
          python -m pip install gdown playwright fonttools deep-translator
          playwright install chromium

      - name: Run Thai Mod Pipeline
        env:
          MODE: ${{ inputs.mode }}
          ROMFS_URL: ${{ inputs.romfs_url }}
          MOD_ZIP_URL: ${{ inputs.mod_zip_url }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/raw" "$RUNNER_TEMP/out" "$RUNNER_TEMP/mod_in" "$RUNNER_TEMP/romfs_tree"

          python3 -u -c '
          import os, sys, json, re, time, struct, subprocess, shutil
          from concurrent.futures import ThreadPoolExecutor
          from fontTools.ttLib import TTFont
          from fontTools.merge import Merger

          sys.path.insert(0, os.path.abspath("dm/tools"))
          import romfs

          temp_dir = os.environ["RUNNER_TEMP"]
          mode = os.environ["MODE"]
          romfs_url = os.environ["ROMFS_URL"]
          mod_zip_url = os.environ.get("MOD_ZIP_URL", "").strip()

          def download_file(url, out_path):
              if "gofile.io/d/" in url.lower():
                  from playwright.sync_api import sync_playwright
                  with sync_playwright() as p:
                      browser = p.chromium.launch(headless=True)
                      context = browser.new_context(accept_downloads=True)
                      page = context.new_page()
                      page.goto(url, wait_until="networkidle", timeout=90000)
                      page.wait_for_selector("button:has-text(\"Download\"), a:has-text(\"Download\")", timeout=45000)
                      time.sleep(2)
                      with page.expect_download(timeout=0) as dl_info:
                          page.locator("button:has-text(\"Download\"), a:has-text(\"Download\")").first.click()
                      dl = dl_info.value
                      print(f"Downloading {dl.suggested_filename}...", flush=True)
                      dl.save_as(out_path)
                      browser.close()
              elif "drive.google.com" in url.lower() or "docs.google.com" in url.lower():
                  subprocess.run(["gdown", url, "-O", out_path], check=True)
              else:
                  subprocess.run(["curl", "-fL", "--retry", "3", "-o", out_path, url], check=True)

          raw_romfs = os.path.join(temp_dir, "raw", "RomFS.img")
          download_file(romfs_url, raw_romfs)
          print("Download finished. Starting processing...", flush=True)

          def crypt_gf_text(data_bytes, entry_idx):
              key = (0x7C89 + entry_idx * 0x2983) & 0xFFFF
              out = bytearray(len(data_bytes))
              for i in range(0, len(data_bytes) - 1, 2):
                  val = struct.unpack_from("<H", data_bytes, i)[0] ^ key
                  struct.pack_into("<H", out, i, val)
                  key = ((key << 3) | (key >> 13)) & 0xFFFF
              return bytes(out)

          def parse_gf_dat(dat_bytes):
              if len(dat_bytes) < 16:
                  return None
              sec_count, entry_count, total_size, initial_key, sec_offset = struct.unpack_from("<HHIII", dat_bytes, 0)
              if sec_count != 1 or sec_offset != 0x10 or total_size > len(dat_bytes):
                  return None
              entries = []
              for i in range(entry_count):
                  off, char_len, _ = struct.unpack_from("<IHH", dat_bytes, sec_offset + 4 + i * 8)
                  raw_str = dat_bytes[sec_offset + off : sec_offset + off + char_len * 2]
                  dec = crypt_gf_text(raw_str, i)
                  chars = []
                  idx = 0
                  while idx + 1 < len(dec):
                      u = struct.unpack_from("<H", dec, idx)[0]
                      idx += 2
                      if u == 0x0000:
                          break
                      elif u == 0x0010 and idx + 3 < len(dec):
                          tag_len, tag_type = struct.unpack_from("<HH", dec, idx)
                          idx += 4
                          params = []
                          for _ in range(max(0, tag_len - 1)):
                              if idx + 1 < len(dec):
                                  params.append(f"{struct.unpack_from(\"<H\", dec, idx)[0]:04X}")
                                  idx += 2
                          chars.append(f"[TAG:{tag_type:04X}:{chr(44).join(params)}]")
                      elif u == 0x000A:
                          chars.append("\n")
                      else:
                          chars.append(chr(u))
                  entries.append("".join(chars))
              return entries

          def build_gf_dat(entries):
              encoded_entries = []
              for i, text in enumerate(entries):
                  buf = bytearray()
                  pos = 0
                  while pos < len(text):
                      if text.startswith("[TAG:", pos):
                          end = text.find("]", pos)
                          if end != -1:
                              parts = text[pos+5:end].split(":")
                              tag_type = int(parts[0], 16)
                              params = [int(x, 16) for x in parts[1].split(",") if x]
                              buf += struct.pack("<HHH", 0x0010, len(params) + 1, tag_type)
                              for p in params:
                                  buf += struct.pack("<H", p)
                              pos = end + 1
                              continue
                      ch = text[pos]
                      if ch == "\n":
                          buf += struct.pack("<H", 0x000A)
                      else:
                          buf += struct.pack("<H", ord(ch))
                      pos += 1
                  buf += struct.pack("<H", 0x0000)
                  enc = crypt_gf_text(bytes(buf), i)
                  while len(enc) % 4 != 0:
                      enc += b"\x00\x00"
                  encoded_entries.append((enc, len(buf) // 2))

              table_size = 4 + len(encoded_entries) * 8
              cur_off = table_size
              table = bytearray(struct.pack("<I", 0))
              body = bytearray()
              for enc, char_len in encoded_entries:
                  table += struct.pack("<IHH", cur_off, char_len, 0)
                  body += enc
                  cur_off += len(enc)
              struct.pack_into("<I", table, 0, cur_off)
              header = struct.pack("<HHIII", 1, len(encoded_entries), cur_off, 0, 0x10)
              return bytes(header + table + body)

          def decode_bfotf(bfotf_bytes):
              if bfotf_bytes[:4] in (b"OTTO", b"\x00\x01\x00\x00"):
                  return bfotf_bytes, None, b"", 0
              if len(bfotf_bytes) < 96:
                  return None, None, b"", 0

              fsize = len(bfotf_bytes)
              for hdr_sub in (0, 16, 32, 48, 64):
                  val = fsize - hdr_sub
                  if val <= 0:
                      continue
                  for endian in ("little", "big"):
                      sz_bytes = val.to_bytes(4, endian)
                      key = bytearray(16)
                      key[0:4] = bfotf_bytes[0:4]
                      for i in range(4):
                          key[4 + i] = bfotf_bytes[4 + i] ^ sz_bytes[i]
                      key[8:16] = bfotf_bytes[8:16]

                      dec_head = bytes([bfotf_bytes[i] ^ key[i % 16] for i in range(96)])
                      for off in (0, 16, 32, 48, 64):
                          if dec_head[off:off+4] in (b"OTTO", b"\x00\x01\x00\x00"):
                              dec_full = bytes([bfotf_bytes[i] ^ key[i % 16] for i in range(fsize)])
                              return dec_full[off:], bytes(key), dec_full[:off], hdr_sub

              sz_le = fsize.to_bytes(4, "little")
              key = bytearray(bfotf_bytes[:16])
              for i in range(4):
                  key[4 + i] ^= sz_le[i]
              dec_dbg = bytes([bfotf_bytes[i] ^ key[i % 16] for i in range(64)])
              print(f"Debug BFOTF dec_head={dec_dbg.hex()}", flush=True)
              return None, None, b"", 0

          def patch_bfotf_with_thai(bfotf_bytes, thai_ttf_path):
              try:
                  orig_font_bytes, xor_key, prefix_hdr, hdr_sub = decode_bfotf(bfotf_bytes)
                  if orig_font_bytes is None:
                      print(f"Skipping BFOTF: head={bfotf_bytes[:32].hex()}", flush=True)
                      return None

                  tmp_orig = "/tmp/orig_game_font.otf"
                  tmp_thai = "/tmp/thai_scaled.ttf"
                  tmp_merged = "/tmp/merged_thai_font.otf"
                  with open(tmp_orig, "wb") as f:
                      f.write(orig_font_bytes)

                  game_font = TTFont(tmp_orig)
                  if "head" not in game_font:
                      game_font.close()
                      return None
                  target_upm = game_font["head"].unitsPerEm
                  game_font.close()

                  thai_font = TTFont(thai_ttf_path)
                  if abs(target_upm - thai_font["head"].unitsPerEm) > 1:
                      from fontTools.ttLib.scaleUpem import scale_upem
                      scale_upem(thai_font, target_upm)
                  thai_font.save(tmp_thai)
                  thai_font.close()

                  merger = Merger()
                  merged = merger.merge([tmp_orig, tmp_thai])
                  merged.save(tmp_merged)
                  merged.close()

                  with open(tmp_merged, "rb") as f:
                      new_font_bytes = f.read()

                  if xor_key is not None:
                      full_out = bytearray(prefix_hdr + new_font_bytes)
                      if len(full_out) >= 8:
                          struct.pack_into("<I", full_out, 4, len(full_out) - hdr_sub)
                      return bytes([full_out[i] ^ xor_key[i % 16] for i in range(len(full_out))])
                  return prefix_hdr + new_font_bytes
              except Exception as e:
                  print(f"Font patch fallback: {e}", flush=True)
                  return None

          def auto_translate_strings(strings):
              from deep_translator import GoogleTranslator
              tag_pattern = re.compile(r"\[TAG:[^\]]+\]")
              results = list(strings)

              todo = []
              for idx, text in enumerate(strings):
                  stripped = text.strip()
                  if not stripped or stripped.lower() == "n/a":
                      continue
                  tags = []
                  def repl(m):
                      tags.append(m.group(0))
                      return f" __T{len(tags)-1}__ "
                  masked = tag_pattern.sub(repl, text).replace("\n", " __NL__ ")
                  if not re.sub(r"(__T\d+__|__NL__)", "", masked).strip():
                      continue
                  todo.append((idx, masked, tags))

              if not todo:
                  return results

              batches = []
              cur_batch, cur_len = [], 0
              for item in todo:
                  item_len = len(item[1]) + 12
                  if cur_batch and cur_len + item_len > 3500:
                      batches.append(cur_batch)
                      cur_batch, cur_len = [], 0
                  cur_batch.append(item)
                  cur_len += item_len
              if cur_batch:
                  batches.append(cur_batch)

              def run_batch(batch):
                  joined = "\n|||SEP|||\n".join(x[1] for x in batch)
                  for attempt in range(2):
                      try:
                          tr = GoogleTranslator(source="en", target="th").translate(joined)
                          if tr:
                              parts = re.split(r"\s*\|\|\|\s*SEP\s*\|\|\|\s*", tr)
                              if len(parts) == len(batch):
                                  out = []
                                  for (orig_idx, _, tags), p in zip(batch, parts):
                                      p = re.sub(r"\s*__NL__\s*", "\n", p, flags=re.IGNORECASE)
                                      for t_i, orig_tag in enumerate(tags):
                                          p = re.sub(rf"\s*__T{t_i}__\s*", orig_tag, p, flags=re.IGNORECASE)
                                      out.append((orig_idx, p.strip()))
                                  return out
                      except Exception:
                          time.sleep(0.5)
                  return []

              with ThreadPoolExecutor(max_workers=6) as ex:
                  for batch_res in ex.map(run_batch, batches):
                      for orig_idx, th_text in batch_res:
                          if th_text:
                              results[orig_idx] = th_text
              return results

          thai_ttf = "/usr/share/fonts/truetype/noto/NotoSansThai-Regular.ttf"
          out_dir = os.path.join(temp_dir, "out")
          img = romfs.Image(raw_romfs)

          if mode == "export":
              os.makedirs(os.path.join(out_dir, "json_text"), exist_ok=True)
              os.makedirs(os.path.join(out_dir, "thai_fonts"), exist_ok=True)
              with open(raw_romfs, "rb") as raw_f:
                  stack = [(0, "")]
                  dat_ok, font_ok = 0, 0
                  while stack:
                      k, rel_path = stack.pop()
                      a, b, _, _, t, _ = img.entry(k)
                      if t == 1:
                          low = rel_path.lower()
                          if low.endswith(".dat") and "bin/message/english/" in low:
                              raw_f.seek(a)
                              parsed = parse_gf_dat(raw_f.read(b))
                              if parsed is not None:
                                  jpath = os.path.join(out_dir, "json_text", rel_path + ".json")
                                  os.makedirs(os.path.dirname(jpath), exist_ok=True)
                                  with open(jpath, "w", encoding="utf-8") as jf:
                                      json.dump([{"id": i, "en": txt, "th": ""} for i, txt in enumerate(parsed)], jf, ensure_ascii=False, indent=2)
                                  dat_ok += 1
                          elif low.endswith(".bfotf") and "bin/font/" in low and "or_font" not in low:
                              raw_f.seek(a)
                              patched = patch_bfotf_with_thai(raw_f.read(b), thai_ttf)
                              if patched:
                                  fpath = os.path.join(out_dir, "thai_fonts", rel_path)
                                  os.makedirs(os.path.dirname(fpath), exist_ok=True)
                                  with open(fpath, "wb") as ff:
                                      ff.write(patched)
                                  font_ok += 1
                      else:
                          for child_name, child_idx in img.children(k):
                              stack.append((child_idx, f"{rel_path}/{child_name}" if rel_path else child_name))
              print(f"Exported {dat_ok} JSON text files and patched {font_ok} Thai BFOTF fonts!", flush=True)

          elif mode in ("build", "translate_all"):
              mod_dir = os.path.join(temp_dir, "mod_in")
              tree_dir = os.path.join(temp_dir, "romfs_tree")
              if mod_zip_url:
                  mod_zip = os.path.join(temp_dir, "raw", "mod_in.zip")
                  download_file(mod_zip_url, mod_zip)
                  subprocess.run(["7z", "x", mod_zip, f"-o{mod_dir}", "-y"], check=True)

              translated_by_path = {}
              translated_by_name = {}
              for r, _, fs in os.walk(mod_dir):
                  if "__MACOSX" in r:
                      continue
                  for fn in fs:
                      if fn.startswith("._"):
                          continue
                      if fn.endswith(".dat.json") or fn.endswith(".json"):
                          full_p = os.path.join(r, fn)
                          norm = full_p.replace("\\", "/")
                          base_dat = fn[:-5] if fn.endswith(".dat.json") else (fn[:-5] + ".dat")
                          translated_by_name[base_dat
