name: Extract Game Text & Fonts

on:
  workflow_dispatch:
    inputs:
      nsp_url:
        description: 'Gofile or Google Drive link for RomFS.img (6.0GB)'
        required: true
        type: string
      keys_url:
        description: 'Optional: leave blank when using RomFS.img'
        required: false
        default: ''
        type: string
      extra_urls:
        description: 'Optional: leave blank'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools & Python packages
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full unar xxd curl file
          python -m pip install gdown playwright
          playwright install chromium

      - name: Download & Unpack RomFS.img
        env:
          ROMFS_URL: ${{ inputs.nsp_url }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/raw" "$RUNNER_TEMP/extracted" "$RUNNER_TEMP/inspect"

          cat << 'EOF' > "$RUNNER_TEMP/dl_gofile.py"
          import sys, time
          from playwright.sync_api import sync_playwright

          url = sys.argv[1]
          out = sys.argv[2]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(accept_downloads=True)
              page = context.new_page()
              page.goto(url, wait_until="networkidle", timeout=90000)
              page.wait_for_selector("button:has-text('Download'), a:has-text('Download')", timeout=45000)
              time.sleep(2)
              with page.expect_download(timeout=0) as download_info:
                  page.locator("button:has-text('Download'), a:has-text('Download')").first.click()
              download = download_info.value
              print(f"Downloading {download.suggested_filename}...")
              download.save_as(out)
              browser.close()
          EOF

          if echo "$ROMFS_URL" | grep -qiE "gofile\.io/d/"; then
            python3 "$RUNNER_TEMP/dl_gofile.py" "$ROMFS_URL" "$RUNNER_TEMP/raw/RomFS.img"
          elif echo "$ROMFS_URL" | grep -qiE "drive\.google\.com|docs\.google\.com"; then
            gdown "$ROMFS_URL" -O "$RUNNER_TEMP/raw/RomFS.img"
          else
            curl -fL --retry 3 -o "$RUNNER_TEMP/raw/RomFS.img" "$ROMFS_URL"
          fi

          ls -lh "$RUNNER_TEMP/raw/RomFS.img"

          # อ่านโครงสร้างการแพ็ก RomFS.img จาก scripts/build_ipa_from_nsp.py และแตกไฟล์ย่อยทั้งหมดออกมา
          python3 - "$RUNNER_TEMP/raw/RomFS.img" "$RUNNER_TEMP/extracted" << 'EOF'
          import os, sys, struct, re

          img_path, out_dir = sys.argv[1], sys.argv[2]

          # 1. ดึงโค้ดส่วนสร้าง/อ่าน RomFS.img จาก scripts/build_ipa_from_nsp.py เพื่อดูฟอร์แมตเป๊ะๆ
          with open("scripts/build_ipa_from_nsp.py", "r", encoding="utf-8", errors="ignore") as f:
              lines = f.readlines()

          print("=== Reference from build_ipa_from_nsp.py ===")
          for i, line in enumerate(lines):
              if "RomFS.img" in line or "packed_romfs" in line or "romfs_image" in line:
                  start = max(0, i - 5)
                  end = min(len(lines), i + 25)
                  print("".join(lines[start:end]))
                  print("-" * 40)

          # 2. ตรวจสอบ Header ของไฟล์ RomFS.img จริง
          with open(img_path, "rb") as f:
              hdr = f.read(64)
              print("First 64 bytes hex:", hdr.hex())
              print("First 16 bytes ascii:", hdr[:16])

              # รองรับรูปแบบมาตรฐานของ NX2Apple RomFS.img (Magic + Version + FileCount + TableOffset + ...)
              magic = hdr[:4]
              if magic in (b"NXRF", b"ROMF", b"NX2A"):
                  f.seek(0)
                  # อ่าน Header 16 หรือ 32 bytes
                  m, ver, count, reserved = struct.unpack("<4sIII", f.read(16))
                  print(f"Matched Magic: {m}, Version: {ver}, Entries: {count}")
                  # ลองอ่านตารางไฟล์ (PathLen, Offset, Size)
                  for idx in range(count):
                      raw_len = f.read(4)
                      if len(raw_len) < 4:
                          break
                      plen = struct.unpack("<I", raw_len)[0]
                      if plen == 0 or plen > 1024:
                          break
                      rel_path = f.read(plen).decode("utf-8", errors="replace").lstrip("/")
                      offset, size = struct.unpack("<QQ", f.read(16))
                      cur_pos = f.tell()

                      dest = os.path.join(out_dir, rel_path)
                      os.makedirs(os.path.dirname(dest), exist_ok=True)
                      f.seek(offset)
                      with open(dest, "wb") as out_f:
                          rem = size
                          while rem > 0:
                              chunk = f.read(min(rem, 8 * 1024 * 1024))
                              if not chunk:
                                  break
                              out_f.write(chunk)
                              rem -= len(chunk)
                      f.seek(cur_pos)
                  print(f"Unpacked {count} files successfully!")
          EOF

          # 3. คัดเฉพาะไฟล์ข้อความและฟอนต์ทั้งหมดเข้าโฟลเดอร์ inspect
          find "$RUNNER_TEMP/extracted" -type f \( -iname "*message*" -o -iname "*.dat" -o -iname "*.tbl" -o -iname "*.msbt" -o -iname "*.bfotf" -o -iname "*.bfttf" -o -iname "*.ttf" -o -iname "*.otf" -o -iname "*.json" -o -iname "*.txt" -o -iname "*.bin" \) -exec cp --parents {} "$RUNNER_TEMP/inspect/" \;
          echo "=== Extracted Text & Fonts ==="
          find "$RUNNER_TEMP/inspect" -type f | head -n 50

      - name: Upload Inspect Files
        uses: actions/upload-artifact@v4
        with:
          name: text-and-fonts
          path: ${{ runner.temp }}/inspect/
