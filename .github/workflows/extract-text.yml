name: Extract Game Text & Fonts

on:
  workflow_dispatch:
    inputs:
      nsp_url:
        description: 'Google Drive link for base game (.nsp/.xci/.nsz)'
        required: true
        type: string
      update_url:
        description: 'Optional: Google Drive link for Update file'
        required: false
        default: ''
        type: string
      keys_url:
        description: 'Google Drive link for prod.keys'
        required: true
        type: string

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full unar
          pip install gdown nsz

      - name: Download files
        env:
          NSP_URL: ${{ inputs.nsp_url }}
          UPDATE_URL: ${{ inputs.update_url }}
          KEYS_URL: ${{ inputs.keys_url }}
        run: |
          mkdir -p work/raw work/game work/keys work/romfs

          # โหลดและจัดการ keys
          gdown --fuzzy "$KEYS_URL" -O work/raw/keys_in
          if 7z x work/raw/keys_in -owork/keys -y >/dev/null 2>&1; then
            FOUND_KEYS=$(find work/keys -iname "*prod*.keys" | head -n 1)
            [ -n "$FOUND_KEYS" ] && [ "$FOUND_KEYS" != "work/keys/prod.keys" ] && cp "$FOUND_KEYS" work/keys/prod.keys
          else
            cp work/raw/keys_in work/keys/prod.keys
          fi

          # โหลดและจัดการไฟล์เกมหลัก
          gdown --fuzzy "$NSP_URL" -O work/raw/base_in
          if ! 7z x work/raw/base_in -owork/game -y >/dev/null 2>&1; then
            mv work/raw/base_in work/game/base.nsp
          fi

          # โหลดและจัดการไฟล์อัปเดต (ถ้ามี)
          if [ -n "$UPDATE_URL" ]; then
            gdown --fuzzy "$UPDATE_URL" -O work/raw/upd_in
            if ! 7z x work/raw/upd_in -owork/game -y >/dev/null 2>&1; then
              mv work/raw/upd_in work/game/upd.nsp
            fi
          fi

          # แตกไฟล์ nsz/xcz ถ้ามี
          find work/game -iname "*.nsz" -o -iname "*.xcz" | while read -r f; do
            nsz -D "$f" -o work/game && rm -f "$f"
          done

      - name: Download hactool & Extract RomFS
        run: |
          wget -q https://github.com/SciresM/hactool/releases/download/1.4.0/hactool-1.4.0-linux.tar.gz
          tar -xzf hactool-1.4.0-linux.tar.gz
          chmod +x hactool

          BASE_FILE=$(ls -S work/game/* | head -n 1)
          UPD_FILE=$(ls -S work/game/* | sed -n '2p')

          mkdir -p work/nca
          ./hactool -k work/keys/prod.keys -t pfs0 --pfs0dir=work/nca "$BASE_FILE" || ./hactool -k work/keys/prod.keys -t xci --securedir=work/nca "$BASE_FILE"
          MAIN_NCA=$(ls -S work/nca/*.nca | head -n 1)

          if [ -n "$UPD_FILE" ]; then
            mkdir -p work/nca_upd
            ./hactool -k work/keys/prod.keys -t pfs0 --pfs0dir=work/nca_upd "$UPD_FILE"
            UPD_NCA=$(ls -S work/nca_upd/*.nca | head -n 1)
            ./hactool -k work/keys/prod.keys --basenca="$MAIN_NCA" --romfsdir=work/romfs "$UPD_NCA"
          else
            ./hactool -k work/keys/prod.keys --romfsdir=work/romfs "$MAIN_NCA"
          fi

          mkdir -p work/inspect
          find work/romfs -type f \( -iname "*message*" -o -iname "*.dat" -o -iname "*.tbl" -o -iname "*.msbt" -o -iname "*.bfotf" -o -iname "*.bfttf" -o -iname "*.ttf" -o -iname "*.otf" \) -exec cp --parents {} work/inspect/ \;
          ls -lh work/inspect/work/romfs/

      - name: Upload Inspect Files
        uses: actions/upload-artifact@v4
        with:
          name: text-and-fonts
          path: work/inspect/work/romfs/
