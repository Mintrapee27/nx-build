name: Extract Game Text & Fonts

on:
  workflow_dispatch:
    inputs:
      nsp_url:
        description: 'Gofile or Google Drive link for RomFS.img (6.0GB)'
        required: true
        type: string
      keys_url:
        description: 'Optional: leave blank when using RomFS.img'
        required: false
        default: ''
        type: string
      extra_urls:
        description: 'Optional: leave blank'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools & Python packages
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full unar xxd curl
          python -m pip install gdown playwright
          playwright install chromium

      - name: Download & Extract Text and Fonts from DMROMFS1
        env:
          ROMFS_URL: ${{ inputs.nsp_url }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/raw" "$RUNNER_TEMP/inspect"

          cat << 'EOF' > "$RUNNER_TEMP/dl_gofile.py"
          import sys, time
          from playwright.sync_api import sync_playwright

          url = sys.argv[1]
          out = sys.argv[2]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(accept_downloads=True)
              page = context.new_page()
              page.goto(url, wait_until="networkidle", timeout=90000)
              page.wait_for_selector("button:has-text('Download'), a:has-text('Download')", timeout=45000)
              time.sleep(2)
              with page.expect_download(timeout=0) as download_info:
                  page.locator("button:has-text('Download'), a:has-text('Download')").first.click()
              download = download_info.value
              print(f"Downloading {download.suggested_filename}...")
              download.save_as(out)
              browser.close()
          EOF

          if echo "$ROMFS_URL" | grep -qiE "gofile\.io/d/"; then
            python3 "$RUNNER_TEMP/dl_gofile.py" "$ROMFS_URL" "$RUNNER_TEMP/raw/RomFS.img"
          elif echo "$ROMFS_URL" | grep -qiE "drive\.google\.com|docs\.google\.com"; then
            gdown "$ROMFS_URL" -O "$RUNNER_TEMP/raw/RomFS.img"
          else
            curl -fL --retry 3 -o "$RUNNER_TEMP/raw/RomFS.img" "$ROMFS_URL"
          fi

          # ใช้คลาส romfs.Image ของโปรเจกต์โดยตรง อ่านและคัดเฉพาะไฟล์ข้อความกับฟอนต์ออกมา
          python3 - "$RUNNER_TEMP/raw/RomFS.img" "$RUNNER_TEMP/inspect" << 'EOF'
          import os, sys
          sys.path.insert(0, os.path.abspath("dm/tools"))
          import romfs

          img_path, out_dir = sys.argv[1], sys.argv[2]
          img = romfs.Image(img_path)
          print(f"Loaded DMROMFS1 successfully: {img.count} total entries")

          target_exts = (".dat", ".tbl", ".msbt", ".bfotf", ".bfttf", ".ttf", ".otf", ".json", ".txt", ".bin", ".arc", ".trpak", ".trpfs", ".trpfd")
          extracted_count = 0

          with open(img_path, "rb") as raw_f:
              stack = [(0, "")]
              while stack:
                  k, rel_path = stack.pop()
                  a, b, _, _, t, _ = img.entry(k)
                  if t == 1:
                      lower_path = rel_path.lower()
                      if (
                          "message" in lower_path
                          or "text" in lower_path
                          or "font" in lower_path
                          or "lang" in lower_path
                          or lower_path.endswith(target_exts)
                      ):
                          dest = os.path.join(out_dir, rel_path)
                          os.makedirs(os.path.dirname(dest), exist_ok=True)
                          raw_f.seek(a)
                          with open(dest, "wb") as out_f:
                              rem = b
                              while rem > 0:
                                  chunk = raw_f.read(min(rem, 8 * 1024 * 1024))
                                  if not chunk:
                                      break
                                  out_f.write(chunk)
                                  rem -= len(chunk)
                          extracted_count += 1
                  else:
                      for child_name, child_idx in img.children(k):
                          child_rel = f"{rel_path}/{child_name}" if rel_path else child_name
                          stack.append((child_idx, child_rel))

          print(f"Extracted {extracted_count} text/font/archive files into inspect folder.")
          EOF

          echo "=== Folder Structure ==="
          find "$RUNNER_TEMP/inspect" -maxdepth 4

      - name: Upload Inspect Files
        uses: actions/upload-artifact@v4
        with:
          name: text-and-fonts
          path: ${{ runner.temp }}/inspect/
