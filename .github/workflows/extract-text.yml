name: Extract Game Text & Fonts

on:
  workflow_dispatch:
    inputs:
      nsp_url:
        description: 'Gofile or Google Drive link for base game (.nsp/.nsz/.xci/.zip/.7z)'
        required: true
        type: string
      keys_url:
        description: 'Gofile or Google Drive link for prod.keys'
        required: true
        type: string
      extra_urls:
        description: 'Optional: Gofile or Google Drive links for Update / DLC'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools & Build hactool for Linux
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full unar xxd curl build-essential git
          python -m pip install gdown nsz playwright
          playwright install chromium
          git clone --depth 1 https://github.com/SciresM/hactool.git "$RUNNER_TEMP/hactool_src"
          cd "$RUNNER_TEMP/hactool_src" && cp config.mk.template config.mk && make -j$(nproc)
          sudo cp hactool /usr/local/bin/

      - name: Download & Extract Game Text and Fonts
        env:
          NSP_URL: ${{ inputs.nsp_url }}
          KEYS_URL: ${{ inputs.keys_url }}
          EXTRA_URLS: ${{ inputs.extra_urls }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/raw" "$RUNNER_TEMP/game" "$RUNNER_TEMP/keys_extract" "$RUNNER_TEMP/work" "$RUNNER_TEMP/inspect" "$HOME/.switch"

          cat << 'EOF' > "$RUNNER_TEMP/dl_gofile.py"
          import sys, time
          from playwright.sync_api import sync_playwright

          url = sys.argv[1]
          out = sys.argv[2]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(accept_downloads=True)
              page = context.new_page()
              page.goto(url, wait_until="networkidle", timeout=90000)
              page.wait_for_selector("button:has-text('Download'), a:has-text('Download')", timeout=45000)
              time.sleep(2)
              with page.expect_download(timeout=0) as download_info:
                  page.locator("button:has-text('Download'), a:has-text('Download')").first.click()
              download = download_info.value
              print(f"Downloading {download.suggested_filename}...")
              download.save_as(out)
              browser.close()
          EOF

          download_file() {
            local url="$1"
            local out="$2"
            if echo "$url" | grep -qiE "gofile\.io/d/"; then
              python3 "$RUNNER_TEMP/dl_gofile.py" "$url" "$out"
            elif echo "$url" | grep -qiE "drive\.google\.com|docs\.google\.com"; then
              gdown "$url" -O "$out"
            else
              curl -fL --retry 3 -o "$out" "$url"
            fi
          }

          process_file() {
            local src="$1"
            local out_dir="$2"
            local fallback_name="$3"
            local sig6 sig4 xci_magic
            sig6=$(head -c 6 "$src" | xxd -p | tr -d '\n')
            sig4="${sig6:0:8}"

            if [ "$sig6" = "377abcaf271c" ] || [ "$sig4" = "504b0304" ] || [ "$sig4" = "504b0506" ] || [ "$sig4" = "504b0708" ]; then
              7z x "$src" -o"$out_dir" -y
              rm -f "$src"
            elif [ "$sig6" = "526172211a07" ]; then
              unar -f -o "$out_dir" "$src"
              rm -f "$src"
            else
              xci_magic=$(dd if="$src" bs=1 skip=256 count=4 2>/dev/null || true)
              if head -c 65536 "$src" | grep -qa "\.ncz"; then
                if [ "$xci_magic" = "HEAD" ]; then
                  mv "$src" "$out_dir/${fallback_name}.xcz"
                else
                  mv "$src" "$out_dir/${fallback_name}.nsz"
                fi
              elif [ "$xci_magic" = "HEAD" ]; then
                mv "$src" "$out_dir/${fallback_name}.xci"
              else
                mv "$src" "$out_dir/${fallback_name}.nsp"
              fi
            fi
          }

          # 1. เตรียม prod.keys (เก็บในพื้นที่ชั่วคราวและไม่แสดงค่าใน Log)
          download_file "$KEYS_URL" "$RUNNER_TEMP/raw/keys_in"
          process_file "$RUNNER_TEMP/raw/keys_in" "$RUNNER_TEMP/keys_extract" "keys"
          FOUND_KEYS=$(find "$RUNNER_TEMP/keys_extract" -type f -iname "*prod*.keys" | head -n 1)
          [ -z "$FOUND_KEYS" ] && FOUND_KEYS=$(find "$RUNNER_TEMP/keys_extract" -type f -iname "*.keys" | head -n 1)
          [ -z "$FOUND_KEYS" ] && FOUND_KEYS=$(find "$RUNNER_TEMP/keys_extract" -type f | head -n 1)
          cp "$FOUND_KEYS" "$HOME/.switch/prod.keys"

          # 2. โหลดไฟล์เกมหลักและไฟล์อัปเดต
          download_file "$NSP_URL" "$RUNNER_TEMP/raw/base_in"
          process_file "$RUNNER_TEMP/raw/base_in" "$RUNNER_TEMP/game" "base"

          i=1
          for url in $(echo "$EXTRA_URLS" | tr ',' ' '); do
            [ -z "$url" ] && continue
            download_file "$url" "$RUNNER_TEMP/raw/extra_${i}_in"
            process_file "$RUNNER_TEMP/raw/extra_${i}_in" "$RUNNER_TEMP/game" "extra_${i}"
            i=$((i + 1))
          done

          find "$RUNNER_TEMP/game" -mindepth 2 -type f \( -iname "*.nsp" -o -iname "*.xci" -o -iname "*.nsz" -o -iname "*.xcz" \) -exec mv -n {} "$RUNNER_TEMP/game/" \;

          if find "$RUNNER_TEMP/game" -maxdepth 1 -type f \( -iname "*.nsz" -o -iname "*.xcz" \) | grep -q .; then
            find "$RUNNER_TEMP/game" -maxdepth 1 -type f \( -iname "*.nsz" -o -iname "*.xcz" \) | while read -r comp_file; do
              nsz -D "$comp_file" -o "$RUNNER_TEMP/game"
              rm -f "$comp_file"
            done
          fi

          # 3. ตรวจสอบและแตกไฟล์ทุกตัวใน game/ ด้วย hactool (Linux Native)
          mkdir -p "$RUNNER_TEMP/nca_base" "$RUNNER_TEMP/nca_upd" "$RUNNER_TEMP/romfs"
          for f in "$RUNNER_TEMP/game"/*; do
            echo "Inspecting $(basename "$f") ($(du -h "$f" | cut -f1))..."
            xxd -l 32 "$f"
            if [[ "$(basename "$f")" == extra_* ]]; then
              hactool --intype=pfs0 --pfs0dir="$RUNNER_TEMP/nca_upd" "$f" || true
            else
              hactool --intype=pfs0 --pfs0dir="$RUNNER_TEMP/nca_base" "$f" || \
              hactool --intype=xci --securedir="$RUNNER_TEMP/nca_base" "$f" || \
              7z x "$f" -o"$RUNNER_TEMP/romfs" -y >/dev/null 2>&1 || true
            fi
          done

          # 4. แตก RomFS จาก NCA หลัก (และรวมแพตช์ Update ถ้ามี)
          MAIN_NCA=$(ls -S "$RUNNER_TEMP/nca_base"/*.nca 2>/dev/null | head -n 1 || true)
          UPD_NCA=$(ls -S "$RUNNER_TEMP/nca_upd"/*.nca 2>/dev/null | head -n 1 || true)

          if [ -n "$MAIN_NCA" ] && [ -n "$UPD_NCA" ]; then
            echo "Extracting Base + Update RomFS..."
            hactool --basenca="$MAIN_NCA" --romfsdir="$RUNNER_TEMP/romfs" "$UPD_NCA"
          elif [ -n "$MAIN_NCA" ]; then
            echo "Extracting Base RomFS..."
            hactool --romfsdir="$RUNNER_TEMP/romfs" "$MAIN_NCA"
          elif [ -n "$UPD_NCA" ]; then
            echo "Extracting Update RomFS..."
            hactool --romfsdir="$RUNNER_TEMP/romfs" "$UPD_NCA"
          fi

          # 5. คัดไฟล์ข้อความและฟอนต์ทั้งหมดเข้าโฟลเดอร์ inspect
          find "$RUNNER_TEMP/romfs" -type f \( -iname "*message*" -o -iname "*.dat" -o -iname "*.tbl" -o -iname "*.msbt" -o -iname "*.bfotf" -o -iname "*.bfttf" -o -iname "*.ttf" -o -iname "*.otf" -o -iname "*.json" -o -iname "*.txt" -o -iname "*.bin" \) -exec cp --parents {} "$RUNNER_TEMP/inspect/" \;
          ls -lh "$RUNNER_TEMP/inspect"

      - name: Upload Inspect Files
        uses: actions/upload-artifact@v4
        with:
          name: text-and-fonts
          path: ${{ runner.temp }}/inspect/
