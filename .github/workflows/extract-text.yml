name: Extract Game Text & Fonts

on:
  workflow_dispatch:
    inputs:
      nsp_url:
        description: 'Gofile, Direct link, or Google Drive link for base game (.nsp/.xci/.nsz) OR RomFS.img'
        required: true
        type: string
      update_url:
        description: 'Link for Update file (leave blank if using RomFS.img)'
        required: false
        default: 'https://drive.google.com/file/d/1_cyvLZfiHaM1iVCS4aS4mwC5wc40eS5J/view?usp=drivesdk'
        type: string
      keys_url:
        description: 'Link for prod.keys (leave blank if using RomFS.img)'
        required: false
        default: 'https://drive.google.com/file/d/1QAzpusGYqRGnrXi9fJhS4SAd3nGu0edO/view?usp=drivesdk'
        type: string

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools & Build hactool
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full unar build-essential git curl
          pip install gdown nsz playwright
          playwright install chromium
          git clone --depth 1 https://github.com/SciresM/hactool.git
          cd hactool && cp config.mk.template config.mk && make -j$(nproc)
          sudo cp hactool /usr/local/bin/

      - name: Download & Extract RomFS
        env:
          NSP_URL: ${{ inputs.nsp_url }}
          UPDATE_URL: ${{ inputs.update_url }}
          KEYS_URL: ${{ inputs.keys_url }}
        run: |
          mkdir -p work/raw work/game work/keys work/romfs

          cat << 'EOF' > dl_gofile.py
          import sys
          from playwright.sync_api import sync_playwright

          url = sys.argv[1]
          out = sys.argv[2]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(accept_downloads=True)
              page = context.new_page()
              page.goto(url, wait_until="networkidle", timeout=60000)
              page.wait_for_selector("button:has-text('Download'), a:has-text('Download')", timeout=30000)
              with page.expect_download(timeout=0) as download_info:
                  page.locator("button:has-text('Download'), a:has-text('Download')").first.click()
              download = download_info.value
              download.save_as(out)
              browser.close()
          EOF

          download_file() {
            local url="$1"
            local out="$2"
            if [[ "$url" == *"drive.google.com"* ]]; then
              gdown "$url" -O "$out"
            elif [[ "$url" == *"gofile.io/d/"* ]]; then
              echo "Downloading from Gofile via headless browser..."
              python3 dl_gofile.py "$url" "$out"
            else
              curl -L -f "$url" -o "$out"
            fi
          }

          download_file "$NSP_URL" work/raw/main_in

          # เช็กว่าเป็นไฟล์ RomFS.img อยู่แล้วหรือไม่
          if hactool -t romfs --romfsdir=work/romfs work/raw/main_in >/dev/null 2>&1; then
            echo "Extracted directly from RomFS.img!"
          else
            if [ -z "$KEYS_URL" ]; then
              echo "Error: keys_url is required for .nsp/.xci files!"
              exit 1
            fi
            download_file "$KEYS_URL" work/raw/keys_in
            if 7z x work/raw/keys_in -owork/keys -y >/dev/null 2>&1; then
              FOUND_KEYS=$(find work/keys -iname "*prod*.keys" | head -n 1)
              [ -n "$FOUND_KEYS" ] && [ "$FOUND_KEYS" != "work/keys/prod.keys" ] && cp "$FOUND_KEYS" work/keys/prod.keys
            else
              cp work/raw/keys_in work/keys/prod.keys
            fi

            if ! 7z x work/raw/main_in -owork/game -y >/dev/null 2>&1; then
              mv work/raw/main_in work/game/base.nsp
            fi

            if [ -n "$UPDATE_URL" ]; then
              download_file "$UPDATE_URL" work/raw/upd_in
              if ! 7z x work/raw/upd_in -owork/game -y >/dev/null 2>&1; then
                mv work/raw/upd_in work/game/upd.nsp
              fi
            fi

            find work/game -iname "*.nsz" -o -iname "*.xcz" | while read -r f; do
              nsz -D "$f" -o work/game && rm -f "$f"
            done

            BASE_FILE=$(ls -S work/game/* | head -n 1)
            UPD_FILE=$(ls -S work/game/* | sed -n '2p')

            mkdir -p work/nca
            hactool -k work/keys/prod.keys -t pfs0 --pfs0dir=work/nca "$BASE_FILE" || hactool -k work/keys/prod.keys -t xci --securedir=work/nca "$BASE_FILE"
            MAIN_NCA=$(ls -S work/nca/*.nca | head -n 1)

            if [ -n "$UPD_FILE" ]; then
              mkdir -p work/nca_upd
              hactool -k work/keys/prod.keys -t pfs0 --pfs0dir=work/nca_upd "$UPD_FILE"
              UPD_NCA=$(ls -S work/nca_upd/*.nca | head -n 1)
              hactool -k work/keys/prod.keys --basenca="$MAIN_NCA" --romfsdir=work/romfs "$UPD_NCA"
            else
              hactool -k work/keys/prod.keys --romfsdir=work/romfs "$MAIN_NCA"
            fi
          fi

          mkdir -p work/inspect
          find work/romfs -type f \( -iname "*message*" -o -iname "*.dat" -o -iname "*.tbl" -o -iname "*.msbt" -o -iname "*.bfotf" -o -iname "*.bfttf" -o -iname "*.ttf" -o -iname "*.otf" \) -exec cp --parents {} work/inspect/ \;
          ls -lh work/inspect/work/romfs/

      - name: Upload Inspect Files
        uses: actions/upload-artifact@v4
        with:
          name: text-and-fonts
          path: work/inspect/work/romfs/
