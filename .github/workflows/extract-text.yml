name: Extract Game Text & Fonts

on:
  workflow_dispatch:
    inputs:
      nsp_url:
        description: 'Gofile or Direct link for base game (.nsp/.xci/.nsz) OR RomFS.img'
        required: true
        type: string
      update_url:
        description: 'Optional: Gofile or Google Drive link for Update file'
        required: false
        default: ''
        type: string
      keys_url:
        description: 'Gofile or Google Drive link for prod.keys (leave blank if using RomFS.img)'
        required: false
        default: ''
        type: string

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools & Build nstool + hactool
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full unar build-essential git curl cmake
          pip install gdown nsz playwright
          playwright install chromium
          git clone --depth 1 https://github.com/jakcron/nstool.git
          cd nstool && make -j$(nproc) && sudo cp bin/nstool /usr/local/bin/
          cd ..
          git clone --depth 1 https://github.com/SciresM/hactool.git
          cd hactool && cp config.mk.template config.mk && make -j$(nproc) && sudo cp hactool /usr/local/bin/

      - name: Download & Extract RomFS
        env:
          NSP_URL: ${{ inputs.nsp_url }}
          UPDATE_URL: ${{ inputs.update_url }}
          KEYS_URL: ${{ inputs.keys_url }}
        run: |
          mkdir -p work/raw work/game work/keys work/romfs work/inspect ~/.switch

          cat << 'EOF' > dl_browser.py
          import sys
          from playwright.sync_api import sync_playwright

          url = sys.argv[1]
          out = sys.argv[2]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(accept_downloads=True)
              page = context.new_page()
              page.goto(url, wait_until="networkidle", timeout=60000)
              page.wait_for_selector("button:has-text('Download'), a:has-text('Download'), #uc-download-link", timeout=30000)
              with page.expect_download(timeout=0) as download_info:
                  page.locator("button:has-text('Download'), a:has-text('Download'), #uc-download-link").first.click()
              download = download_info.value
              download.save_as(out)
              browser.close()
          EOF

          download_file() {
            local url="$1"
            local out="$2"
            if [[ "$url" == *"gofile.io/d/"* ]]; then
              echo "Downloading from Gofile..."
              python3 dl_browser.py "$url" "$out"
            elif [[ "$url" == *"drive.google.com"* ]]; then
              echo "Downloading from Google Drive..."
              gdown "$url" -O "$out" || python3 dl_browser.py "$url" "$out"
            else
              curl -L -f "$url" -o "$out"
            fi
          }

          download_file "$NSP_URL" work/raw/main_in
          ls -lh work/raw/main_in

          # ใช้ nstool แตก RomFS.img ตรงๆ (รองรับทั้ง IVFC และ Raw RomFS โดยไม่แครช)
          echo "Trying direct RomFS extraction with nstool..."
          nstool -t romfs -x work/romfs work/raw/main_in || true

          if [ -z "$(ls -A work/romfs)" ]; then
            echo "Not a raw RomFS.img. Switching to Game Package decryption..."
            if [ -z "$KEYS_URL" ]; then
              echo "Error: keys_url is required for .nsp/.xci files!"
              exit 1
            fi

            download_file "$KEYS_URL" work/raw/keys_in
            7z x work/raw/keys_in -owork/keys -y >/dev/null 2>&1 || cp work/raw/keys_in work/keys/raw.keys

            find work/keys -type f -exec grep -hE '^[a-zA-Z0-9_]+\s*=\s*[0-9a-fA-F]{32,}' {} + | tr -d '\r' > ~/.switch/prod.keys
            echo "Loaded $(wc -l < ~/.switch/prod.keys) valid keys into ~/.switch/prod.keys"

            if [ ! -s ~/.switch/prod.keys ]; then
              echo "Error: No valid keys found! Check your keys_url."
              exit 1
            fi

            if ! 7z x work/raw/main_in -owork/game -y >/dev/null 2>&1; then
              mv work/raw/main_in work/game/base.nsp
            fi

            if [ -n "$UPDATE_URL" ]; then
              download_file "$UPDATE_URL" work/raw/upd_in
              if ! 7z x work/raw/upd_in -owork/game -y >/dev/null 2>&1; then
                mv work/raw/upd_in work/game/upd.nsp
              fi
            fi

            find work/game -iname "*.nsz" -o -iname "*.xcz" | while read -r f; do
              nsz -D "$f" -o work/game && rm -f "$f"
            done

            BASE_FILE=$(ls -S work/game/* | head -n 1)
            UPD_FILE=$(ls -S work/game/* | sed -n '2p')

            mkdir -p work/nca
            hactool --intype=pfs0 --pfs0dir=work/nca "$BASE_FILE" || hactool --intype=xci --securedir=work/nca "$BASE_FILE"
            MAIN_NCA=$(ls -S work/nca/*.nca | head -n 1)

            if [ -n "$UPD_FILE" ]; then
              mkdir -p work/nca_upd
              hactool --intype=pfs0 --pfs0dir=work/nca_upd "$UPD_FILE"
              UPD_NCA=$(ls -S work/nca_upd/*.nca | head -n 1)
              hactool --basenca="$MAIN_NCA" --romfsdir=work/romfs "$UPD_NCA"
            else
              hactool --romfsdir=work/romfs "$MAIN_NCA"
            fi
          else
            echo "Successfully extracted RomFS.img with nstool!"
          fi

          find work/romfs -type f \( -iname "*message*" -o -iname "*.dat" -o -iname "*.tbl" -o -iname "*.msbt" -o -iname "*.bfotf" -o -iname "*.bfttf" -o -iname "*.ttf" -o -iname "*.otf" \) -exec cp --parents {} work/inspect/ \;
          ls -lh work/inspect/work/romfs/

      - name: Upload Inspect Files
        uses: actions/upload-artifact@v4
        with:
          name: text-and-fonts
          path: work/inspect/work/romfs/
